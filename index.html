<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master - Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 border-b-4 border-indigo-500">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-500 p-2 rounded-lg font-black text-white">RH</div>
                <h1 id="nav-empresa" class="font-black text-xl tracking-tighter uppercase">CORPORATE SYSTEM</h1>
            </div>
            <div class="flex gap-2 md:gap-6 overflow-x-auto text-[10px] font-black uppercase">
                <button onclick="mudarAba('aba-home')" class="hover:text-indigo-400 p-2">Painel</button>
                <button onclick="mudarAba('aba-equipe')" class="hover:text-indigo-400 p-2">Colaboradores</button>
                <button onclick="mudarAba('aba-financeiro')" class="hover:text-indigo-400 p-2">Pagamentos</button>
                <button onclick="mudarAba('aba-ponto')" class="hover:text-indigo-400 p-2">Ponto</button>
                <button onclick="mudarAba('aba-lixeira')" class="hover:text-rose-400 p-2 text-rose-300">Lixeira</button>
                <button onclick="mudarAba('aba-config')" class="bg-indigo-600 px-3 py-2 rounded-md">⚙️</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 mt-6 pb-32">
        
        <section id="aba-home" class="aba-item">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <p class="text-slate-400 text-[10px] font-bold uppercase">Folha Mensal</p>
                    <p id="d-custo" class="text-2xl font-black text-slate-800">R$ 0,00</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <p class="text-slate-400 text-[10px] font-bold uppercase">Ativos</p>
                    <p id="d-ativos" class="text-2xl font-black text-slate-800">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-rose-100 bg-rose-50/30">
                    <p class="text-rose-400 text-[10px] font-bold uppercase">Desligados</p>
                    <p id="d-lixeira" class="text-2xl font-black text-rose-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <p class="text-slate-400 text-[10px] font-bold uppercase">Média Salarial</p>
                    <p id="d-media" class="text-2xl font-black text-slate-800">R$ 0</p>
                </div>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-sm border max-w-4xl mx-auto">
                <canvas id="graficoPrincipal" height="100"></canvas>
            </div>
        </section>

        <section id="aba-equipe" class="aba-item hidden">
            <div class="bg-white p-8 rounded-3xl shadow-sm border mb-10">
                <h2 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-indigo-600 rounded-full"></span> Ficha de Registro
                </h2>
                <form id="formCadastro" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Nome Completo</label>
                        <input type="text" id="c-nome" required class="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">CPF</label>
                        <input type="text" id="c-cpf" placeholder="000.000.000-00" class="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Salário Bruto</label>
                        <input type="number" id="c-salario" required class="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Cargo</label>
                        <select id="c-cargo" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                            <option>Operacional</option>
                            <option>Analista</option>
                            <option>Gerência</option>
                            <option>Diretoria</option>
                        </select>
                    </div>
                    <div class="md:col-span-3 flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 text-white font-black p-4 rounded-xl hover:bg-indigo-700 transition">EFETIVAR CONTRATAÇÃO</button>
                    </div>
                </form>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr><th class="p-4 text-xs font-bold text-slate-400 uppercase">Colaborador</th><th class="p-4 text-xs font-bold text-slate-400 uppercase">Cargo</th><th class="p-4 text-right">Ação</th></tr>
                    </thead>
                    <tbody id="lista-equipe"></tbody>
                </table>
            </div>
        </section>

        <section id="aba-financeiro" class="aba-item hidden">
            <div id="grid-financeiro" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <section id="aba-ponto" class="aba-item hidden">
            <div class="max-w-md mx-auto text-center">
                <div class="bg-slate-900 text-white p-10 rounded-[3rem] shadow-2xl mb-10 border-b-8 border-indigo-500">
                    <p id="relogio" class="text-5xl font-mono font-black mb-8 tracking-tighter text-indigo-400">00:00:00</p>
                    <div class="flex gap-2">
                        <button onclick="marcarPonto('ENTRADA')" class="flex-1 bg-emerald-500 p-4 rounded-2xl font-black text-xs hover:bg-emerald-400 transition">ENTRADA</button>
                        <button onclick="marcarPonto('SAÍDA')" class="flex-1 bg-rose-500 p-4 rounded-2xl font-black text-xs hover:bg-rose-400 transition">SAÍDA</button>
                    </div>
                </div>
                <div id="lista-ponto" class="space-y-2 text-left"></div>
            </div>
        </section>

        <section id="aba-lixeira" class="aba-item hidden text-center">
            <h2 class="text-xl font-black text-rose-600 mb-6 uppercase tracking-widest">Arquivo de Inativos</h2>
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden max-w-4xl mx-auto">
                <table class="w-full text-left">
                    <tbody id="lista-lixeira"></tbody>
                </table>
            </div>
        </section>

        <section id="aba-config" class="aba-item hidden">
            <div class="bg-white p-8 rounded-3xl shadow-sm border max-w-lg mx-auto">
                <h2 class="font-black text-2xl mb-6">Ajustes do Sistema</h2>
                <div class="space-y-4">
                    <input type="text" id="cfg-empresa" placeholder="Nome da Empresa" class="w-full border-2 p-4 rounded-2xl">
                    <button onclick="salvarConfig()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black">SALVAR ALTERAÇÕES</button>
                    <hr>
                    <button onclick="exportarDados()" class="w-full bg-indigo-100 text-indigo-700 p-3 rounded-xl font-bold text-xs uppercase">Exportar Backup (JSON)</button>
                    <button onclick="resetarSistema()" class="w-full text-rose-500 text-[10px] font-black uppercase mt-4">Reset Total de Fábrica</button>
                </div>
            </div>
        </section>

    </main>

    <div id="pdf-container" class="hidden p-12 bg-white" style="width: 800px;">
        <h1 id="pdf-empresa" class="text-3xl font-black text-indigo-900 border-b-4 border-indigo-900 pb-2"></h1>
        <div class="mt-8 space-y-2">
            <p><strong>COLABORADOR:</strong> <span id="pdf-n"></span></p>
            <p><strong>CARGO:</strong> <span id="pdf-c"></span></p>
            <p><strong>SALÁRIO BASE:</strong> R$ <span id="pdf-s"></span></p>
            <p class="text-rose-600"><strong>INSS (RETIDO):</strong> R$ <span id="pdf-i"></span></p>
            <div class="mt-10 p-6 bg-indigo-50 rounded-2xl border-2 border-indigo-100">
                <h2 class="text-2xl font-black text-indigo-900">LÍQUIDO: R$ <span id="pdf-l"></span></h2>
            </div>
        </div>
    </div>

    <script>
        // --- CORE DO SISTEMA ---
        let meuGrafico = null;
        const getBD = () => JSON.parse(localStorage.getItem('RH_FINAL_V1')) || [];
        const getLixeira = () => JSON.parse(localStorage.getItem('RH_LIXEIRA_V1')) || [];
        const getPontos = () => JSON.parse(localStorage.getItem('RH_PONTOS_V1')) || [];

        function mudarAba(id) {
            document.querySelectorAll('.aba-item').forEach(aba => aba.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'aba-home') atualizarDash();
            if(id === 'aba-equipe') renderEquipe();
            if(id === 'aba-financeiro') renderFinanceiro();
            if(id === 'aba-lixeira') renderLixeira();
            if(id === 'aba-ponto') renderPonto();
        }

        setInterval(() => {
            const rel = document.getElementById('relogio');
            if(rel) rel.innerText = new Date().toLocaleTimeString();
        }, 1000);

        // --- CRUD EQUIPE ---
        document.getElementById('formCadastro').onsubmit = (e) => {
            e.preventDefault();
            const bd = getBD();
            bd.push({
                id: Date.now(),
                nome: document.getElementById('c-nome').value,
                cpf: document.getElementById('c-cpf').value,
                salario: parseFloat(document.getElementById('c-salario').value),
                cargo: document.getElementById('c-cargo').value
            });
            localStorage.setItem('RH_FINAL_V1', JSON.stringify(bd));
            e.target.reset();
            renderEquipe();
            alert("Contratação Registrada!");
        };

        function renderEquipe() {
            const bd = getBD();
            document.getElementById('lista-equipe').innerHTML = bd.map(f => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-4 font-black text-slate-700 text-sm">${f.nome}</td>
                    <td class="p-4 text-xs font-bold text-slate-400 uppercase">${f.cargo}</td>
                    <td class="p-4 text-right"><button onclick="moverLixeira(${f.id})" class="text-rose-400 hover:text-rose-600 font-black text-[10px]">DESLIGAR</button></td>
                </tr>
            `).join('');
        }

        // --- LIXEIRA (RESTAURAÇÃO) ---
        function moverLixeira(id) {
            let bd = getBD();
            let lixeira = getLixeira();
            const func = bd.find(x => x.id === id);
            lixeira.push(func);
            bd = bd.filter(x => x.id !== id);
            localStorage.setItem('RH_FINAL_V1', JSON.stringify(bd));
            localStorage.setItem('RH_LIXEIRA_V1', JSON.stringify(lixeira));
            renderEquipe();
        }

        function renderLixeira() {
            const lixeira = getLixeira();
            document.getElementById('lista-lixeira').innerHTML = lixeira.map(f => `
                <tr class="border-b bg-rose-50/20">
                    <td class="p-4 font-bold text-slate-500">${f.nome}</td>
                    <td class="p-4 text-right"><button onclick="restaurar(${f.id})" class="bg-indigo-600 text-white px-3 py-1 rounded text-[10px] font-black">REATIVAR</button></td>
                </tr>
            `).join('');
        }

        function restaurar(id) {
            let lixeira = getLixeira();
            let bd = getBD();
            const func = lixeira.find(x => x.id === id);
            bd.push(func);
            lixeira = lixeira.filter(x => x.id !== id);
            localStorage.setItem('RH_FINAL_V1', JSON.stringify(bd));
            localStorage.setItem('RH_LIXEIRA_V1', JSON.stringify(lixeira));
            renderLixeira();
        }

        // --- FINANCEIRO & PDF ---
        function renderFinanceiro() {
            const bd = getBD();
            document.getElementById('grid-financeiro').innerHTML = bd.map(f => {
                const inss = f.salario * 0.11;
                const liq = f.salario - inss;
                return `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <p class="font-black text-slate-800">${f.nome}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-4">${f.cargo}</p>
                        <p class="text-indigo-600 font-black text-xl italic mb-4">R$ ${liq.toFixed(2)}</p>
                        <button onclick="gerarPDF('${f.nome}', '${f.cargo}', ${f.salario}, ${inss}, ${liq})" class="w-full bg-slate-900 text-white p-3 rounded-xl text-[10px] font-black uppercase">Gerar Holerite</button>
                    </div>
                `;
            }).join('');
        }

        function gerarPDF(n, c, s, i, l) {
            document.getElementById('pdf-n').innerText = n;
            document.getElementById('pdf-c').innerText = c;
            document.getElementById('pdf-s').innerText = s.toFixed(2);
            document.getElementById('pdf-i').innerText = i.toFixed(2);
            document.getElementById('pdf-l').innerText = l.toFixed(2);
            document.getElementById('pdf-empresa').innerText = localStorage.getItem('cfg_nome') || "RH MASTER";
            const area = document.getElementById('pdf-container');
            area.classList.remove('hidden');
            html2pdf().from(area).save(`Holerite_${n}.pdf`).then(() => area.classList.add('hidden'));
        }

        // --- PONTO ---
        function marcarPonto(tipo) {
            const p = getPontos();
            p.unshift({ tipo, data: new Date().toLocaleString() });
            localStorage.setItem('RH_PONTOS_V1', JSON.stringify(p));
            renderPonto();
        }

        function renderPonto() {
            const p = getPontos();
            document.getElementById('lista-ponto').innerHTML = p.map(l => `
                <div class="bg-white p-4 rounded-xl border-l-4 ${l.tipo === 'ENTRADA' ? 'border-emerald-500' : 'border-rose-500'} shadow-sm text-xs font-bold text-slate-600">
                    ${l.tipo}: ${l.data}
                </div>
            `).join('');
        }

        // --- DASHBOARD E CONFIGS ---
        function atualizarDash() {
            const bd = getBD();
            const lix = getLixeira();
            const custo = bd.reduce((acc, f) => acc + f.salario, 0);
            
            document.getElementById('d-custo').innerText = `R$ ${custo.toFixed(2)}`;
            document.getElementById('d-ativos').innerText = bd.length;
            document.getElementById('d-lixeira').innerText = lix.length;
            document.getElementById('d-media').innerText = `R$ ${(bd.length ? custo/bd.length : 0).toFixed(2)}`;

            const ctx = document.getElementById('graficoPrincipal').getContext('2d');
            if(meuGrafico) meuGrafico.destroy();
            meuGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: bd.map(f => f.nome.split(' ')[0]),
                    datasets: [{ label: 'Salário Base', data: bd.map(f => f.salario), backgroundColor: '#6366f1', borderRadius: 10 }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        function salvarConfig() {
            localStorage.setItem('cfg_nome', document.getElementById('cfg-empresa').value);
            aplicarConfig();
            alert("Configurações Salvas!");
        }

        function aplicarConfig() {
            const n = localStorage.getItem('cfg_nome') || "CORPORATE RH";
            document.getElementById('nav-empresa').innerText = n;
            document.getElementById('cfg-empresa').value = n;
        }

        function resetarSistema() {
            if(confirm("ATENÇÃO: Isso apagará TODOS os funcionários e registros. Continuar?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function exportarDados() {
            const dados = { ativos: getBD(), lixeira: getLixeira(), pontos: getPontos() };
            const blob = new Blob([JSON.stringify(dados)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'backup_rh_master.json';
            a.click();
        }

        // INICIALIZAÇÃO
        aplicarConfig();
        renderEquipe();
        atualizarDash();
    </script>
</body>
</html>
