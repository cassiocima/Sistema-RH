<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-gray-200">
    <div class="bg-white p-6 rounded shadow-xl max-w-md mx-auto">
        <h1 class="font-bold mb-4">Teste de Cadastro</h1>
        <input type="text" id="testeNome" placeholder="Nome" class="border p-2 w-full mb-2">
        <button onclick="testar()" class="bg-blue-500 text-white p-2 w-full">CADASTRAR</button>
        
        <div id="resultado" class="mt-4 font-bold text-green-600"></div>
    </div>

    <script>
        function testar() {
            const nome = document.getElementById('testeNome').value;
            if(nome) {
                document.getElementById('resultado').innerText = "Sucesso: " + nome + " cadastrado!";
                document.getElementById('testeNome').value = "";
            } else {
                alert("Digite um nome!");
            }
        }
    </script>
</body>
</html>
