<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master - Cadastro de Funcionários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-800">Sistema RH Master</h1>
            <p class="text-gray-600">Módulo de Cadastro de Colaboradores (FRD-RF010)</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Novo Cadastro</h2>
            <form id="formFuncionario" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                    <input type="text" id="nome" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cargo</label>
                    <input type="text" id="cargo" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Salário Base (R$)</label>
                    <input type="number" id="salario" step="0.01" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                        Salvar Colaborador
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-4 bg-gray-50 border-b">
                <h2 class="text-lg font-semibold text-gray-700">Colaboradores Cadastrados</h2>
            </div>
            <table class="w-full text-left">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3 text-sm font-semibold text-gray-600">Nome</th>
                        <th class="p-3 text-sm font-semibold text-gray-600">Cargo</th>
                        <th class="p-3 text-sm font-semibold text-gray-600">Salário</th>
                        <th class="p-3 text-sm font-semibold text-gray-600">Ação</th>
                    </tr>
                </thead>
                <tbody id="listaFuncionarios">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById('formFuncionario');
        const lista = document.getElementById('listaFuncionarios');

        // Função para carregar dados salvos
        function carregarFuncionarios() {
            const dados = JSON.parse(localStorage.getItem('funcionarios')) || [];
            lista.innerHTML = '';
            
            dados.forEach((func, index) => {
                const linha = `
                    <tr class="border-t hover:bg-gray-50">
                        <td class="p-3 text-sm">${func.nome}</td>
                        <td class="p-3 text-sm">${func.cargo}</td>
                        <td class="p-3 text-sm">R$ ${func.salario}</td>
                        <td class="p-3 text-sm">
                            <button onclick="remover(${index})" class="text-red-500 hover:underline">Excluir</button>
                        </td>
                    </tr>
                `;
                lista.innerHTML += linha;
            });
        }

        // Função para salvar novo funcionário
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const novoFunc = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                cargo: document.getElementById('cargo').value,
                salario: document.getElementById('salario').value
            };

            const bancoAtual = JSON.parse(localStorage.getItem('funcionarios')) || [];
            bancoAtual.push(novoFunc);
            localStorage.setItem('funcionarios', JSON.stringify(bancoAtual));
            
            form.reset();
            carregarFuncionarios();
            alert('Funcionário cadastrado com sucesso!');
        });

        // Função para remover
        function remover(index) {
            const bancoAtual = JSON.parse(localStorage.getItem('funcionarios')) || [];
            bancoAtual.splice(index, 1);
            localStorage.setItem('funcionarios', JSON.stringify(bancoAtual));
            carregarFuncionarios();
        }

        // Iniciar a página carregando os dados
        carregarFuncionarios();
    </script>
</body>
</html>
