<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master ERP - Compliance Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="tela-login" class="fixed inset-0 z-[100] bg-indigo-950 flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md border-t-8 border-indigo-500 text-center">
            <h2 class="text-3xl font-black text-slate-900 mb-2">SISTEMA RH</h2>
            <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-8">Acesso Administrativo</p>
            <input type="text" id="login-user" placeholder="Usuário" class="w-full border-2 p-4 rounded-2xl mb-4 outline-none focus:border-indigo-500">
            <input type="password" id="login-pass" placeholder="Senha" class="w-full border-2 p-4 rounded-2xl mb-8 outline-none focus:border-indigo-500">
            <button onclick="tentarLogin()" class="w-full bg-indigo-600 text-white font-black p-5 rounded-2xl hover:bg-indigo-700 transition">ENTRAR</button>
        </div>
    </div>

    <div id="conteudo-sistema" class="hidden">
        <nav class="bg-white shadow-sm sticky top-0 z-50 border-b">
            <div class="max-w-7xl mx-auto flex justify-between items-center p-5">
                <h1 class="font-black text-xl tracking-tighter uppercase">RH<span class="text-indigo-600">_MASTER</span></h1>
                <div class="flex gap-8 text-[10px] font-black uppercase text-slate-500">
                    <button onclick="mudarAba('aba-home')">Painel</button>
                    <button onclick="mudarAba('aba-equipe')">Colaboradores</button>
                    <button onclick="mudarAba('aba-financeiro')">Folha de Pagamento</button>
                    <button onclick="logout()" class="text-rose-500">Sair</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-6 mt-4">
            <section id="aba-home" class="aba-item">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-indigo-500">
                        <p class="text-slate-400 text-[10px] font-black uppercase">Folha Mensal</p>
                        <p id="d-custo" class="text-2xl font-black">R$ 0,00</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm">
                        <p class="text-slate-400 text-[10px] font-black uppercase">Ativos</p>
                        <p id="d-ativos" class="text-2xl font-black">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm">
                        <p class="text-slate-400 text-[10px] font-black uppercase">Afastados</p>
                        <p id="d-afastados" class="text-2xl font-black text-amber-500">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm">
                        <p class="text-slate-400 text-[10px] font-black uppercase">FGTS Total</p>
                        <p id="d-fgts" class="text-2xl font-black text-indigo-600">R$ 0,00</p>
                    </div>
                </div>
                <div class="bg-white p-10 rounded-[2rem] shadow-sm border"><canvas id="graficoFolha" height="80"></canvas></div>
            </section>

            <section id="aba-equipe" class="aba-item hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black uppercase tracking-tighter">Gestão de Colaboradores</h2>
                    <button onclick="abrirModal()" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition">+ NOVO CADASTRO COMPLETO</button>
                </div>
                <div class="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                            <tr>
                                <th class="p-6">Colaborador</th>
                                <th class="p-6">Status</th>
                                <th class="p-6">Dependentes</th>
                                <th class="p-6 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-equipe" class="divide-y text-sm"></tbody>
                    </table>
                </div>
            </section>

            <section id="aba-financeiro" class="aba-item hidden">
                <div id="grid-financeiro" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </section>
        </main>
    </div>

    <div id="modal-cadastro" class="fixed inset-0 z-[110] bg-slate-900/90 hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-6xl rounded-[3rem] shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
            <div class="p-6 bg-indigo-600 text-white flex justify-between items-center">
                <h3 class="font-black text-xl uppercase tracking-widest">Dossiê do Colaborador</h3>
                <button onclick="fecharModal()" class="hover:rotate-90 transition-all font-bold">X FECHAR</button>
            </div>

            <div class="flex bg-slate-100 px-8 border-b">
                <button onclick="mudarTabModal('m-dados')" class="tab-btn-mod p-4 text-[10px] font-black border-b-4 border-indigo-600">DADOS PRINCIPAIS</button>
                <button onclick="mudarTabModal('m-dependentes')" class="tab-btn-mod p-4 text-[10px] font-black border-b-4 border-transparent">DEPENDENTES</button>
                <button onclick="mudarTabModal('m-afastamentos')" class="tab-btn-mod p-4 text-[10px] font-black border-b-4 border-transparent">AFASTAMENTOS</button>
            </div>
            
            <div class="p-8 overflow-y-auto custom-scrollbar flex-1">
                <form id="formFunc">
                    <div id="m-dados" class="tab-content-mod grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2">
                            <label class="text-[9px] font-black uppercase text-slate-400">Nome Completo</label>
                            <input type="text" id="f-nome" class="w-full p-3 rounded-xl border-2 outline-none focus:border-indigo-400">
                        </div>
                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-400">CPF</label>
                            <input type="text" id="f-cpf" class="w-full p-3 rounded-xl border-2 outline-none focus:border-indigo-400">
                        </div>
                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-400">Cargo</label>
                            <input type="text" id="f-cargo" class="w-full p-3 rounded-xl border-2 outline-none">
                        </div>
                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-400">Salário Bruto</label>
                            <input type="number" id="f-salario" class="w-full p-3 rounded-xl border-2 outline-none">
                        </div>
                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-400">Status Atual</label>
                            <select id="f-status" class="w-full p-3 rounded-xl border-2">
                                <option value="Ativo">Ativo</option>
                                <option value="Afastado">Afastado (Licença)</option>
                                <option value="Férias">Férias</option>
                                <option value="Desligado">Desligado</option>
                            </select>
                        </div>
                    </div>

                    <div id="m-dependentes" class="tab-content-mod hidden">
                        <div class="flex gap-4 mb-4">
                            <input type="text" id="dep-nome" placeholder="Nome do Dependente" class="flex-1 p-3 rounded-xl border-2">
                            <select id="dep-parentesco" class="p-3 rounded-xl border-2">
                                <option>Filho(a)</option>
                                <option>Cônjuge</option>
                                <option>Pai/Mãe</option>
                            </select>
                            <button type="button" onclick="addDependente()" class="bg-indigo-600 text-white px-6 rounded-xl font-bold">ADD</button>
                        </div>
                        <ul id="lista-dep-ui" class="space-y-2"></ul>
                    </div>

                    <div id="m-afastamentos" class="tab-content-mod hidden">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 bg-amber-50 rounded-2xl">
                            <div>
                                <label class="text-[9px] font-bold">Tipo</label>
                                <select id="af-tipo" class="w-full p-2 rounded border"><option>Licença Médica</option><option>Férias</option><option>Maternidade</option></select>
                            </div>
                            <div>
                                <label class="text-[9px] font-bold">Início</label>
                                <input type="date" id="af-inicio" class="w-full p-2 rounded border">
                            </div>
                            <div>
                                <button type="button" onclick="addAfastamento()" class="mt-4 w-full bg-amber-600 text-white p-2 rounded-lg font-bold">REGISTRAR</button>
                            </div>
                        </div>
                        <div id="lista-af-ui" class="space-y-2"></div>
                    </div>
                </form>
            </div>

            <div class="p-6 bg-slate-50 border-t flex gap-4">
                <button onclick="salvar()" class="flex-1 bg-indigo-600 text-white font-black p-4 rounded-2xl shadow-lg">CONSOLIDAR ALTERAÇÕES</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('RH_PRO_V2')) || [];
        let idEdicao = null;
        let dependentesTemp = [];
        let afastamentosTemp = [];

        // --- SISTEMA ---
        function tentarLogin() {
            if(document.getElementById('login-user').value === 'admin' && document.getElementById('login-pass').value === '1234') {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('conteudo-sistema').classList.remove('hidden');
                atualizarTudo();
            }
        }

        function mudarAba(id) {
            document.querySelectorAll('.aba-item').forEach(a => a.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            atualizarTudo();
        }

        function mudarTabModal(id) {
            document.querySelectorAll('.tab-content-mod').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn-mod').forEach(b => b.classList.replace('border-indigo-600', 'border-transparent'));
            document.getElementById(id).classList.remove('hidden');
            event.target.classList.replace('border-transparent', 'border-indigo-600');
        }

        // --- LÓGICA DE NEGÓCIO ---
        function addDependente() {
            const nome = document.getElementById('dep-nome').value;
            if(!nome) return;
            dependentesTemp.push({ nome, parentesco: document.getElementById('dep-parentesco').value });
            renderDeps();
        }

        function renderDeps() {
            document.getElementById('lista-dep-ui').innerHTML = dependentesTemp.map((d, i) => `
                <li class="bg-white p-3 border rounded-xl flex justify-between items-center text-xs">
                    <span><b>${d.nome}</b> - ${d.parentesco}</span>
                    <button onclick="dependentesTemp.splice(${i}, 1); renderDeps()" class="text-rose-500 font-bold">Remover</button>
                </li>
            `).join('');
        }

        function addAfastamento() {
            const tipo = document.getElementById('af-tipo').value;
            const data = document.getElementById('af-inicio').value;
            if(!data) return;
            afastamentosTemp.push({ tipo, data });
            renderAfast();
        }

        function renderAfast() {
            document.getElementById('lista-af-ui').innerHTML = afastamentosTemp.map(a => `
                <div class="bg-amber-100 p-3 rounded-xl text-xs border border-amber-200">
                    🚀 <b>${a.tipo}</b> iniciado em ${a.data}
                </div>
            `).join('');
        }

        // --- SALVAR ---
        function salvar() {
            const f = {
                id: idEdicao || Date.now(),
                nome: document.getElementById('f-nome').value,
                cpf: document.getElementById('f-cpf').value,
                cargo: document.getElementById('f-cargo').value,
                salario: parseFloat(document.getElementById('f-salario').value),
                status: document.getElementById('f-status').value,
                dependentes: dependentesTemp,
                afastamentos: afastamentosTemp
            };

            if(idEdicao) {
                const idx = db.findIndex(x => x.id === idEdicao);
                db[idx] = f;
            } else db.push(f);

            localStorage.setItem('RH_PRO_V2', JSON.stringify(db));
            fecharModal();
            atualizarTudo();
        }

        function abrirModal() {
            idEdicao = null; dependentesTemp = []; afastamentosTemp = [];
            document.getElementById('formFunc').reset();
            renderDeps(); renderAfast();
            document.getElementById('modal-cadastro').classList.remove('hidden');
        }

        function editar(id) {
            const f = db.find(x => x.id === id);
            idEdicao = id;
            document.getElementById('f-nome').value = f.nome;
            document.getElementById('f-cpf').value = f.cpf;
            document.getElementById('f-cargo').value = f.cargo;
            document.getElementById('f-salario').value = f.salario;
            document.getElementById('f-status').value = f.status;
            dependentesTemp = f.dependentes || [];
            afastamentosTemp = f.afastamentos || [];
            renderDeps(); renderAfast();
            document.getElementById('modal-cadastro').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modal-cadastro').classList.add('hidden'); }

        // --- DASHBOARD & RENDERS ---
        function atualizarTudo() {
            renderEquipe();
            renderFinanceiro();
            
            const totalBruto = db.reduce((acc, f) => acc + f.salario, 0);
            const afastados = db.filter(f => f.status === 'Afastado' || f.status === 'Férias').length;
            
            document.getElementById('d-custo').innerText = `R$ ${totalBruto.toLocaleString()}`;
            document.getElementById('d-ativos').innerText = db.filter(f => f.status === 'Ativo').length;
            document.getElementById('d-afastados').innerText = afastados;
            document.getElementById('d-fgts').innerText = `R$ ${(totalBruto * 0.08).toLocaleString()}`;
        }

        function renderEquipe() {
            document.getElementById('lista-equipe').innerHTML = db.map(f => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-6">
                        <p class="font-black text-slate-800 uppercase">${f.nome}</p>
                        <p class="text-[10px] text-indigo-500 font-bold">${f.cargo}</p>
                    </td>
                    <td class="p-6">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${f.status === 'Ativo' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">
                            ${f.status}
                        </span>
                    </td>
                    <td class="p-6 text-xs text-slate-400 font-bold">${f.dependentes?.length || 0} Deps</td>
                    <td class="p-6 text-right">
                        <button onclick="editar(${f.id})" class="bg-slate-100 hover:bg-indigo-600 hover:text-white p-2 px-4 rounded-xl text-[10px] font-black transition">VER DETALHES</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderFinanceiro() {
            // Lógica de cálculo considerando dependentes
            document.getElementById('grid-financeiro').innerHTML = db.map(f => {
                const baseIRRF = f.salario - (f.dependentes.length * 189.59);
                return `
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-black text-sm uppercase">${f.nome}</h4>
                            <span class="text-[9px] bg-slate-100 p-1 px-2 rounded font-bold">${f.dependentes.length} DEP.</span>
                        </div>
                        <div class="flex justify-between text-xs mb-2"><span>Salário Base</span> <b>R$ ${f.salario.toFixed(2)}</b></div>
                        <div class="flex justify-between text-xs text-rose-500"><span>Ded. Dependentes</span> <b>- R$ ${(f.dependentes.length * 189.59).toFixed(2)}</b></div>
                        <div class="mt-4 pt-4 border-t flex justify-between items-center">
                            <span class="text-[10px] font-black text-indigo-500 uppercase tracking-tighter">Estimativa Líquida</span>
                            <span class="text-xl font-black">R$ ${(f.salario * 0.85).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
