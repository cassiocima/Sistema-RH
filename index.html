<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master - Sistema Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center">
            <h1 class="font-black text-xl tracking-tighter mr-4">RH_MASTER PRO</h1>
            <div class="flex space-x-2 md:space-x-6 overflow-x-auto py-2">
                <button onclick="aba('equipe')" class="text-xs font-bold uppercase hover:text-yellow-400 whitespace-nowrap">👥 Equipe</button>
                <button onclick="aba('folha')" class="text-xs font-bold uppercase hover:text-yellow-400 whitespace-nowrap">💰 Folha</button>
                <button onclick="aba('ponto')" class="text-xs font-bold uppercase hover:text-yellow-400 whitespace-nowrap">⏰ Ponto</button>
                <button onclick="aba('vagas')" class="text-xs font-bold uppercase hover:text-yellow-400 whitespace-nowrap">📢 Vagas</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 mt-4">
        
        <section id="equipe">
            <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                <h2 class="font-bold text-gray-700 mb-4">Cadastrar Novo Colaborador</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="fnome" placeholder="Nome Completo" class="border-2 border-slate-100 p-3 rounded-xl focus:border-blue-500 outline-none">
                    <input type="number" id="fsalario" placeholder="Salário Bruto" class="border-2 border-slate-100 p-3 rounded-xl focus:border-blue-500 outline-none">
                    <button onclick="adicionar()" class="bg-blue-600 text-white rounded-xl font-black hover:bg-blue-700 transition">SALVAR</button>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr><th class="p-4 text-xs font-black text-slate-400 uppercase">Nome</th><th class="p-4 text-xs font-black text-slate-400 uppercase">Salário</th><th class="p-4 text-right">Acção</th></tr>
                    </thead>
                    <tbody id="tabela-equipe"></tbody>
                </table>
            </div>
        </section>

        <section id="folha" class="hidden">
            <h2 class="font-black text-2xl mb-6 text-blue-900 italic">Folha de Pagamento</h2>
            <div id="lista-folha" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <section id="ponto" class="hidden text-center">
            <div class="bg-white p-10 rounded-3xl shadow-sm border inline-block w-full max-w-md">
                <h2 class="text-gray-400 font-bold uppercase text-xs mb-2">Relógio Digital</h2>
                <div id="relogio" class="text-5xl font-black text-blue-900 mb-8 tracking-widest">00:00:00</div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="baterPonto('ENTRADA')" class="bg-emerald-500 text-white p-4 rounded-2xl font-bold shadow-lg shadow-emerald-100 hover:scale-105 transition">ENTRADA</button>
                    <button onclick="baterPonto('SAÍDA')" class="bg-rose-500 text-white p-4 rounded-2xl font-bold shadow-lg shadow-rose-100 hover:scale-105 transition">SAÍDA</button>
                </div>
            </div>
            <div class="mt-8 bg-white rounded-2xl shadow-sm border overflow-hidden text-left max-w-2xl mx-auto">
                <table class="w-full">
                    <thead class="bg-slate-50"><tr><th class="p-4 text-xs font-black text-slate-400">HISTÓRICO DE MARCAÇÕES</th></tr></thead>
                    <tbody id="tabela-ponto"></tbody>
                </table>
            </div>
        </section>

        <section id="vagas" class="hidden">
            <h2 class="font-black text-2xl mb-6 text-blue-900 italic">Recrutamento & Seleção</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl border-l-8
