<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master Pro - v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-900 text-white shadow-2xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center p-4">
            <div class="flex items-center gap-2">
                <div class="bg-yellow-400 w-3 h-8 rounded-full"></div>
                <h1 class="font-black text-2xl tracking-tighter">RH_PRO</h1>
            </div>
            <div class="flex gap-2 md:gap-6">
                <button onclick="mudarAba('aba-equipe')" class="text-xs font-bold hover:text-yellow-400 transition uppercase">Equipe</button>
                <button onclick="mudarAba('aba-folha')" class="text-xs font-bold hover:text-yellow-400 transition uppercase">Financeiro</button>
                <button onclick="mudarAba('aba-ponto')" class="text-xs font-bold hover:text-yellow-400 transition uppercase">Ponto</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 mt-6">
        
        <section id="aba-equipe" class="aba-item">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Cadastrar Colaborador</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="nomeInput" placeholder="Nome Completo" class="border p-3 rounded-xl outline-none focus:ring-2 ring-blue-500">
                    <input type="number" id="salarioInput" placeholder="Salário Bruto (Ex: 3000)" class="border p-3 rounded-xl outline-none focus:ring-2 ring-blue-500">
                    <button onclick="cadastrar()" class="bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">ADICIONAR</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr><th class="p-4 font-bold text-slate-500 text-xs">COLABORADOR</th><th class="p-4 font-bold text-slate-500 text-xs text-right">AÇÕES</th></tr>
                    </thead>
                    <tbody id="tabelaCorpo"></tbody>
                </table>
            </div>
        </section>

        <section id="aba-folha" class="aba-item hidden">
            <h2 class="text-2xl font-black text-blue-900 mb-6 italic">Demonstrativos de Pagamento</h2>
            <div id="gridFolha" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <section id="aba-ponto" class="aba-item hidden text-center">
            <div class="bg-blue-900 text-white p-10 rounded-3xl shadow-2xl inline-block w-full max-w-sm">
                <p id="relogio" class="text-5xl font-mono font-black mb-6">00:00:00</p>
                <button onclick="registrarPonto()" class="bg-yellow-400 text-blue-900 w-full py-4 rounded-2xl font-black text-lg hover:bg-yellow-300 transition shadow-lg">REGISTRAR AGORA</button>
            </div>
            <div class="max-w-md mx-auto mt-10 text-left bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div class="p-4 border-b font-bold bg-slate-50 text-slate-500 text-xs uppercase">Últimos Registros</div>
                <div id="listaPonto" class="divide-y divide-slate-100"></div>
            </div>
        </section>

    </main>

    <div id="render-pdf" class="hidden p-10 bg-white" style="width: 800px;">
        <h1 style="color: #1e3a8a; font-size: 24px; font-weight: bold; border-bottom: 3px solid #1e3a8a;">RECIBO DE PAGAMENTO DE SALÁRIO</h1>
        <div style="margin-top: 20px;">
            <p><strong>NOME:</strong> <span id="pdf-nome"></span></p>
            <p><strong>DATA DE EMISSÃO:</strong> 13/03/2026</p>
        </div>
        <table style="width: 100%; margin-top: 30px; border-collapse: collapse;">
            <tr style="background: #f1f5f9;">
                <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Descrição</th>
                <th style="padding: 10px; border: 1px solid #ddd; text-align: right;">Vencimentos</th>
                <th style="padding: 10px; border: 1px solid #ddd; text-align: right;">Descontos</th>
            </tr>
            <tr>
                <td style="padding: 10px; border: 1px solid #ddd;">Salário Base</td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: right;">R$ <span id="pdf-bruto"></span></td>
                <td style="padding: 10px; border: 1px solid #ddd;"></td>
            </tr>
            <tr>
                <td style="padding: 10px; border: 1px solid #ddd;">INSS (Retido)</td>
                <td style="padding: 10px; border: 1px solid #ddd;"></td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: right; color: red;">R$ <span id="pdf-inss"></span></td>
            </tr>
            <tr style="font-weight: bold;">
                <td style="padding: 10px; border: 1px solid #ddd; background: #eff6ff;">VALOR LÍQUIDO</td>
                <td colspan="2" style="padding: 10px; border: 1px solid #ddd; text-align: right; font-size: 18px; color: #1e40af; background: #eff6ff;">R$ <span id="pdf-liquido"></span></td>
            </tr>
        </table>
    </div>

    <script>
        // 1. GESTÃO DE TELAS
        function mudarAba(id) {
            document.querySelectorAll('.aba-item').forEach(aba => aba.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'aba-folha') renderFolha();
            if(id === 'aba-ponto') renderPonto();
        }

        // 2. RELÓGIO
        setInterval(() => {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // 3. LOGICA DE DADOS (COLABORADORES)
        function cadastrar() {
            const n = document.getElementById('nomeInput').value;
            const s = document.getElementById('salarioInput').value;
            if(!n || !s) return alert("Preencha todos os campos!");

            const bd = JSON.parse(localStorage.getItem('bd_rh_pro')) || [];
            bd.push({ id: Date.now(), nome: n, salario: parseFloat(s) });
            localStorage.setItem('bd_rh_pro', JSON.stringify(bd));
            
            document.getElementById('nomeInput').value = '';
            document.getElementById('salarioInput').value = '';
            renderEquipe();
            alert("Cadastrado com sucesso!");
        }

        function renderEquipe() {
            const bd = JSON.parse(localStorage.getItem('bd_rh_pro')) || [];
            document.getElementById('tabelaCorpo').innerHTML = bd.map(f => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-4 font-bold text-slate-700">${f.nome.toUpperCase()}</td>
                    <td class="p-4 text-right">
                        <button onclick="excluir(${f.id})" class="text-red-500 text-xs font-bold underline">REMOVER</button>
                    </td>
                </tr>
            `).join('');
        }

        function excluir(id) {
            let bd = JSON.parse(localStorage.getItem('bd_rh_pro')) || [];
            bd = bd.filter(x => x.id !== id);
            localStorage.setItem('bd_rh_pro', JSON.stringify(bd));
            renderEquipe();
        }

        // 4. LOGICA FINANCEIRA
        function renderFolha() {
            const bd = JSON.parse(localStorage.getItem('bd_rh_pro')) || [];
            const container = document.getElementById('gridFolha');
            container.innerHTML = bd.map(f => {
                const inss = f.salario * 0.11; // Cálculo simplificado de 11%
                const liq = f.salario - inss;
                return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-black text-slate-800 border-b pb-2 mb-4">${f.nome}</h3>
                        <div class="flex justify-between text-sm mb-1"><span>Bruto:</span> <span>R$ ${f.salario.toFixed(2)}</span></div>
                        <div class="flex justify-between text-sm text-red-500 mb-4"><span>INSS:</span> <span>- R$ ${inss.toFixed(2)}</span></div>
                        <div class="flex justify-between font-black text-blue-700 text-lg"><span>Líquido:</span> <span>R$ ${liq.toFixed(2)}</span></div>
                        <button onclick="baixarPDF('${f.nome}', ${f.salario}, ${inss}, ${liq})" class="w-full mt-4 bg-slate-100 py-2 rounded-xl text-[10px] font-black hover:bg-blue-900 hover:text-white transition uppercase tracking-widest">Gerar Holerite PDF</button>
                    </div>
                `;
            }).join('');
        }

        function baixarPDF(n, s, i, l) {
            document.getElementById('pdf-nome').innerText = n;
            document.getElementById('pdf-bruto').innerText = s.toFixed(2);
            document.getElementById('pdf-inss').innerText = i.toFixed(2);
            document.getElementById('pdf-liquido').innerText = l.toFixed(2);
            
            const area = document.getElementById('render-pdf');
            area.classList.remove('hidden');
            
            const opt = { margin: 1, filename: 'Holerite_'+n+'.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter' } };
            html2pdf().from(area).set(opt).save().then(() => area.classList.add('hidden'));
        }

        // 5. LOGICA DE PONTO
        function registrarPonto() {
            const logs = JSON.parse(localStorage.getItem('ponto_rh_pro')) || [];
            logs.unshift(new Date().toLocaleString());
            localStorage.setItem('ponto_rh_pro', JSON.stringify(logs));
            renderPonto();
            alert("Ponto gravado com sucesso!");
        }

        function renderPonto() {
            const logs = JSON.parse(localStorage.getItem('ponto_rh_pro')) || [];
            document.getElementById('listaPonto').innerHTML = logs.map(l => `
                <div class="p-4 flex items-center gap-3">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-sm font-medium text-slate-600">${l}</span>
                </div>
            `).join('');
        }

        // INICIALIZAÇÃO
        renderEquipe();
    </script>
</body>
</html>
