<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master - Holerites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-xl shadow-sm no-print">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-900">RH Master Pro</h1>
                <p class="text-gray-500 font-medium">Módulo de Folha de Pagamento</p>
            </div>
        </header>

        <div class="flex space-x-8 mb-8 border-b border-gray-200 text-gray-500 font-bold no-print">
            <button onclick="mudarAba('cadastro')" id="btn-cadastro" class="pb-2 tab-active">1. Cadastro</button>
            <button onclick="mudarAba('folha')" id="btn-folha" class="pb-2 hover:text-blue-600 transition">2. Folha & PDF</button>
        </div>

        <div id="aba-cadastro" class="space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border">
                <form id="formFuncionario" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-black text-gray-500 uppercase mb-1">Nome do Funcionário</label>
                        <input type="text" id="nome" required class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-gray-500 uppercase mb-1">Salário Bruto</label>
                        <input type="number" id="salario" step="0.01" required class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-blue-500 outline-none">
                    </div>
                    <button type="submit" class="md:col-span-3 bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 transition">SALVAR</button>
                </form>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <table class="w-full text-left">
                    <tbody id="listaFuncionarios"></tbody>
                </table>
            </div>
        </div>

        <div id="aba-folha" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6" id="cardsFolha">
            </div>
    </div>

    <div id="modelo-pdf" class="hidden">
        <div style="padding: 40px; font-family: sans-serif; color: #333;">
            <h1 style="border-bottom: 2px solid #333;">DEMONSTRATIVO DE PAGAMENTO</h1>
            <p><strong>Empresa:</strong> Minha Empresa RH LTDA</p>
            <hr>
            <p><strong>Funcionário:</strong> <span id="pdf-nome"></span></p>
            <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
                <tr style="background: #eee;">
                    <th style="text-align: left; padding: 10px;">Descrição</th>
                    <th style="text-align: right; padding: 10px;">Proventos</th>
                    <th style="text-align: right; padding: 10px;">Descontos</th>
                </tr>
                <tr>
                    <td style="padding: 10px;">Salário Base</td>
                    <td style="text-align: right; padding: 10px;">R$ <span id="pdf-salario"></span></td>
                    <td></td>
                </tr>
                <tr>
                    <td style="padding: 10px;">INSS</td>
                    <td></td>
                    <td style="text-align: right; padding: 10px; color: red;">R$ <span id="pdf-inss"></span></td>
                </tr>
                <tr style="font-weight: bold; font-size: 1.2em; border-top: 2px solid #333;">
                    <td style="padding: 10px;">LÍQUIDO:</td>
                    <td colspan="2" style="text-align: right; padding: 10px; color: blue;">R$ <span id="pdf-liquido"></span></td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        function mudarAba(aba) {
            document.getElementById('aba-cadastro').classList.toggle('hidden', aba !== 'cadastro');
            document.getElementById('aba-folha').classList.toggle('hidden', aba !== 'folha');
            document.getElementById('btn-cadastro').classList.toggle('tab-active', aba === 'cadastro');
            document.getElementById('btn-folha').classList.toggle('tab-active', aba === 'folha');
            if(aba === 'folha') renderizarFolha();
        }

        const form = document.getElementById('formFuncionario');

        function salvar() {
            const funcionarios = JSON.parse(localStorage.getItem('rh_v2')) || [];
            funcionarios.push({
                id: Date.now(),
                nome: document.getElementById('nome').value,
                salario: parseFloat(document.getElementById('salario').value)
            });
            localStorage.setItem('rh_v2', JSON.stringify(funcionarios));
            form.reset();
            renderizarLista();
        }

        function renderizarLista() {
            const dados = JSON.parse(localStorage.getItem('rh_v2')) || [];
            document.getElementById('listaFuncionarios').innerHTML = dados.map(f => `
                <tr class="border-b"><td class="p-4 font-bold">${f.nome}</td><td class="p-4 text-right"><button onclick="excluir(${f.id})" class="text-red-500">Excluir</button></td></tr>
            `).join('');
        }

        function excluir(id) {
            let dados = JSON.parse(localStorage.getItem('rh_v2')) || [];
            localStorage.setItem('rh_v2', JSON.stringify(dados.filter(f => f.id !== id)));
            renderizarLista();
        }

        function renderizarFolha() {
            const dados = JSON.parse(localStorage.getItem('rh_v2')) || [];
            const container = document.getElementById('aba-folha');
            container.innerHTML = dados.map(f => {
                const inss = f.salario * 0.11; // Simplificado
                const liq = f.salario - inss;
                return `
                    <div class="bg-white p-6 rounded-xl shadow-sm border">
                        <h3 class="font-bold text-lg mb-4">${f.nome}</h3>
                        <p class="text-sm text-gray-600">Salário: R$ ${f.salario.toFixed(2)}</p>
                        <p class="text-sm text-red-500">INSS: R$ ${inss.toFixed(2)}</p>
                        <button onclick="gerarPDF('${f.nome}', ${f.salario}, ${inss}, ${liq})" class="mt-4 w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700">⬇️ Baixar Holerite (PDF)</button>
                    </div>
                `;
            }).join('');
        }

        function gerarPDF(nome, salario, inss, liquido) {
            // Preenche o modelo invisível com os dados
            document.getElementById('pdf-nome').innerText = nome;
            document.getElementById('pdf-salario').innerText = salario.toFixed(2);
            document.getElementById('pdf-inss').innerText = inss.toFixed(2);
            document.getElementById('pdf-liquido').innerText = liquido.toFixed(2);

            const elemento = document.getElementById('modelo-pdf');
            elemento.classList.remove('hidden'); // Mostra para o html2pdf capturar

            const opcoes = {
                margin: 1,
                filename: `Holerite_${nome}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opcoes).from(elemento).save().then(() => {
                elemento.classList.add('hidden'); // Esconde de novo
            });
        }

        form.onsubmit = (e) => { e.preventDefault(); salvar(); };
        renderizarLista();
    </script>
</body>
</html>
