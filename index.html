<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Master - Sistema Integrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .sidebar-item { cursor: pointer; transition: 0.3s; }
        .sidebar-item:hover { background: #1e40af; }
        .active-tab { background: #1e40af; border-left: 4px solid #fbbf24; }
    </style>
</head>
<body class="bg-gray-50 flex min-h-screen font-sans">

    <aside class="w-64 bg-blue-900 text-white flex-shrink-0 hidden md:flex flex-col">
        <div class="p-6 font-black text-2xl tracking-tighter border-b border-blue-800">RH_MASTER</div>
        <nav class="flex-1 mt-4">
            <div onclick="mudarAba('cadastro')" id="m-cadastro" class="sidebar-item p-4 active-tab">👥 Colaboradores</div>
            <div onclick="mudarAba('folha')" id="m-folha" class="sidebar-item p-4">💰 Folha & Holerite</div>
            <div onclick="mudarAba('ponto')" id="m-ponto" class="sidebar-item p-4">⏰ Controle de Ponto</div>
            <div onclick="mudarAba('vagas')" id="m-vagas" class="sidebar-item p-4">📢 Recrutamento</div>
        </nav>
        <div class="p-4 text-xs opacity-50 text-center">v2.0 - 2026</div>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        
        <div id="aba-cadastro">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Gestão de Equipe</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm border mb-8">
                <form id="formFuncionario" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="nome" placeholder="Nome do Funcionário" required class="border p-3 rounded-lg outline-none focus:ring-2 ring-blue-500">
                    <input type="number" id="salario" placeholder="Salário Bruto" required class="border p-3 rounded-lg outline-none">
                    <button type="submit" class="md:col-span-2 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Cadastrar no Sistema</button>
                </form>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 uppercase text-xs font-bold text-gray-600">
                        <tr><th class="p-4">Nome</th><th class="p-4">Salário</th><th class="p-4 text-right">Ação</th></tr>
                    </thead>
                    <tbody id="listaFuncionarios"></tbody>
                </table>
            </div>
        </div>

        <div id="aba-folha" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Processamento de Folha</h2>
            <div id="cardsFolha" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <div id="aba-ponto" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Registro de Jornada</h2>
            <div class="bg-white p-8 rounded-xl shadow-sm border text-center mb-8">
                <div class="text-4xl font-mono font-bold mb-4 text-blue-900" id="relogio">00:00:00</div>
                <div class="flex justify-center gap-4">
                    <button onclick="baterPonto('Entrada')" class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700">Registrar Entrada</button>
                    <button onclick="baterPonto('Saída')" class="bg-red-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-red-700">Registrar Saída</button>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-xs font-bold">
                        <tr><th class="p-4">Data</th><th class="p-4">Tipo</th><th class="p-4">Hora</th></tr>
                    </thead>
                    <tbody id="listaPonto"></tbody>
                </table>
            </div>
        </div>

        <div id="aba-vagas" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Portal de Recrutamento</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border-t-4 border-yellow-500 shadow-sm">
                    <h3 class="font-bold text-lg">Analista de RH</h3>
                    <p class="text-gray-500 text-sm mb-4">São Paulo - Híbrido</p>
                    <span class="bg-green-100 text-green-700 px-2 py-
